<h1>Conferences</h1>

@if (state().status === 'loading') { <p role="status">Loading conferences...</p> }
@else if (state().error; as error) {
  <p role="alert">{{ error.message }}</p>
  <button type="button" (click)="retry()">Retry</button>
}
@else {
<div class="cards-container">
  @for (conf of conferances(); track conf.id) {
    <div class="card">

      <img
        src="https://images.unsplash.com/photo-1540575467063-178a50c2df87"
        alt="Conference"
      />

      <div class="card-content">
        <h2>{{ conf.name }}</h2>

        <p>📅 {{ conf.date }}</p>
        <p>📍 {{ conf.place }}</p>

      </div>
      <button type="button" [routerLink]="['/details', conf.id]">Details</button>
    </div>
  } @empty { <p>No conferences available.</p> }
</div>
}
