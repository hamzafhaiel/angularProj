<h1>Conferences</h1>

<div class="cards-container">
  @for (conf of conferences; track conf.id) {
    <div class="card">

      <img
        src="https://images.unsplash.com/photo-1540575467063-178a50c2df87"
        alt="Conference"
      />

      <div class="card-content">
        <h2>{{ conf.name }}</h2>

        <p>📅 {{ conf.date }}</p>
        <p>📍 {{ conf.place }}</p>
        <a class="details-link" [routerLink]="['/list', conf.id]"
          [attr.aria-label]="'View details for ' + conf.name"
          >View details</a>

      </div>

    </div>
  }
</div>
