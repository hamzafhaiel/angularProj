<h1>Conferences</h1>

<div class="cards-container">
  @for (conf of conferences; track conf.id) {
    <div class="card">

      <img
        src="https://images.unsplash.com/photo-1540575467063-178a50c2df87"
        alt="Conference"
      />

      <div class="card-content">
        <h2>{{ conf.name }}</h2>

        <p>📅 {{ conf.date }}</p>
        <p>📍 {{ conf.place }}</p>
        <button type="button" (click)="viewDetails(conf)"
          [attr.aria-label]="'View details for ' + conf.name"
          aria-controls="conference-details"
          [attr.aria-expanded]="selectedConference()?.id === conf.id">View details</button>

      </div>

    </div>
  }
</div>

<div id="conference-details" aria-live="polite">
  @if (selectedConference(); as conference) {
    <app-conference-details [conf]="conference" (closed)="selectedConference.set(null)" />
  }
</div>
