@if (conf(); as conference) {
  <section class="details-panel" aria-labelledby="details-title">
    <h2 id="details-title">{{ conference.name }} — Conference details</h2>
    <p><strong>Date:</strong> {{ conference.date }}</p>
    <p><strong>Place:</strong> {{ conference.place }}</p>
    <button type="button" (click)="closed.emit()">Close details</button>
  </section>
}
